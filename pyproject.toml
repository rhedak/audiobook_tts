[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobook_tts"]

[project]
name = "audiobook-tts"
version = "0.1.0"
description = "Shared audiobook TTS library built on edge-tts"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7",
    "mutagen>=1.47",
    "pydub>=0.25.1",
    "audioop-lts>=0.2; python_version >= '3.13'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# Browser E2E test only (tests/e2e/web_e2e.py); not installed by plain
# `uv sync`. Install with: uv sync --group e2e
e2e = [
    "playwright>=1.40",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
