[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobook_tts"]

# The heteronyms extra pins the en_core_web_sm model by URL.
[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "audiobook-tts"
version = "0.2.0"
description = "Shared audiobook TTS library: edge-tts, Kokoro, Qwen3-TTS and Chatterbox engines"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7",
    "mutagen>=1.47",
    "pydub>=0.25.1",
    "audioop-lts>=0.2; python_version >= '3.13'",
]

# Engines and helpers beyond edge-tts. Install only what you use, e.g.
#   uv sync --extra kokoro --extra heteronyms
# Chatterbox, Qwen and OmniVoice pin conflicting transformers versions (OmniVoice
# needs transformers>=5.3, qwen-tts pins 4.57.3), so each runs in its own
# environment. Chatterbox's setuptools pin keeps the perth watermark import working.
[project.optional-dependencies]
kokoro = ["kokoro==0.9.4"]
qwen = ["qwen-tts==0.1.1"]
chatterbox = ["chatterbox-tts==0.1.7", "setuptools<81"]
omnivoice = ["omnivoice==0.2.0"]
heteronyms = [
    "spacy>=3.8",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

# Chatterbox and Qwen pin different transformers versions, so uv must lock them as alternatives
# rather than as one environment.
[tool.uv]
conflicts = [
    [{ extra = "qwen" }, { extra = "chatterbox" }],
    [{ extra = "qwen" }, { extra = "omnivoice" }],
    [{ extra = "chatterbox" }, { extra = "omnivoice" }],
]

[dependency-groups]
dev = [
    "numpy>=1.26",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# Browser E2E test only (tests/e2e/web_e2e.py); not installed by plain
# `uv sync`. Install with: uv sync --group e2e
e2e = [
    "playwright>=1.40",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
